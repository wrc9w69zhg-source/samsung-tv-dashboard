<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TV Launcher</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Chromium 69 safe: no backdrop-filter, no flex gap, no inset, no :focus-visible, no optional chaining */
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;font-family:"Helvetica Neue",Roboto,"Segoe UI",Arial,sans-serif;cursor:default}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#04120f}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;background-size:1920px 1080px;background-repeat:no-repeat}
.fog{position:absolute;left:-400px;width:2800px;height:420px;background:radial-gradient(ellipse at 50% 50%,rgba(220,255,245,.13),rgba(220,255,245,0) 62%);animation:drift 70s ease-in-out infinite alternate}
#fog1{top:470px}
#fog2{top:620px;height:360px;animation-duration:95s;animation-direction:alternate-reverse;opacity:.8}
body.noanim .fog{animation:none}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(260px)}}
.shade{position:absolute;left:0;top:0;width:1920px;height:1080px;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,0) 62%),linear-gradient(0deg,rgba(0,0,0,.5),rgba(0,0,0,0) 45%)}

/* Glass: blur is faked by blurring a clipped copy of the scene (no backdrop-filter in Chromium 69) */
.glass{position:absolute;overflow:hidden;border-radius:44px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.2);box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25)}
.glass:before{content:"";position:absolute;left:-60px;top:-60px;right:-60px;bottom:-60px;background-size:1920px 1080px;background-repeat:no-repeat;-webkit-filter:blur(26px) brightness(1.25);filter:blur(26px) brightness(1.25)}
.glass>*{position:relative}

#clock{position:absolute;left:150px;top:170px;transition:opacity .6s,transform .6s;animation:rise 1s .15s backwards}
#hello{font-size:36px;font-weight:300;letter-spacing:2px;opacity:.78;margin:0 0 6px 8px}
#time{font-size:280px;line-height:270px;font-weight:200;letter-spacing:-8px;white-space:nowrap;font-variant-numeric:tabular-nums;text-shadow:0 8px 60px rgba(0,0,0,.45)}
#time small{font-size:84px;letter-spacing:0;opacity:.6;font-weight:300;margin-left:14px}
.c{font-style:normal;animation:blink 2s steps(1) infinite}
body.noanim .c{animation:none}
@keyframes blink{50%{opacity:.25}}
#date{font-size:62px;font-weight:300;margin:14px 0 0 12px;opacity:.92}
@keyframes rise{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}

#dockbg,#dock{left:210px;top:790px;width:1500px;height:250px;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .45s;animation:rise 1s .45s backwards}
#dockbg{box-sizing:border-box;border-radius:64px;border:1px solid rgba(255,255,255,.1);background:rgba(10,14,16,.42);box-shadow:0 36px 90px rgba(0,0,0,.5)}
#dockbg:before{background-position:-150px -730px;-webkit-filter:blur(28px) brightness(.75);filter:blur(28px) brightness(.75)}
#dock{position:absolute;display:flex;align-items:center;justify-content:center}
.tile{position:relative;width:196px;height:196px;margin:0 17px;border-radius:46px;box-shadow:0 14px 32px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.1);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;cursor:pointer}
.tile svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.tile:after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;border-radius:46px;background:linear-gradient(155deg,rgba(255,255,255,.22),rgba(255,255,255,0) 48%);opacity:.55;transition:opacity .35s}
.tile.on{transform:translateY(-12px) scale(1.13);box-shadow:0 34px 60px rgba(0,0,0,.55),0 0 0 3px rgba(255,255,255,.85),0 0 80px var(--g,rgba(255,255,255,.35))}
.tile.on:after{opacity:1}
.sep{width:2px;height:84px;margin:0 16px;background:rgba(255,255,255,.14);border-radius:2px}

#toast{position:absolute;left:0;width:1920px;top:730px;text-align:center;font-size:30px;opacity:0;transition:opacity .35s;pointer-events:none}
#toast span{display:inline-block;padding:12px 32px;border-radius:40px;background:rgba(0,0,0,.55)}

#set{left:510px;top:130px;width:900px;height:820px;opacity:0;transform:translateY(40px) scale(.96);transition:opacity .45s,transform .55s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#set:before{background-position:-450px -70px}
#set h1{margin:0;padding:52px 64px 18px;font-size:54px;font-weight:300}
.row{display:flex;justify-content:space-between;align-items:center;margin:0 40px;padding:0 24px;height:96px;border-radius:26px;font-size:36px;transition:background .25s,box-shadow .25s}
.row b{font-weight:400;opacity:.9}
.row.on{background:rgba(255,255,255,.18);box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 50px var(--acc)}
.row .v{min-width:300px;text-align:center}
.row .ar{opacity:0;transition:opacity .25s;font-size:44px}
.row.on .ar{opacity:.9}
.row.done{justify-content:center;margin-top:18px;background:rgba(255,255,255,.08)}
.hint{position:absolute;left:0;width:100%;bottom:30px;text-align:center;font-size:24px;opacity:.55}
#stage.vs #dock,#stage.vs #dockbg{transform:translateY(280px);opacity:0}
#stage.vs #clock{opacity:0;transform:translateY(-30px)}
#stage.vs #set{opacity:1;transform:none}
body.noanim *{animation:none!important}
</style>
</head>
<body>
<div id="stage">
  <div class="scene"></div>
  <div class="fog" id="fog1"></div><div class="fog" id="fog2"></div>
  <div class="shade"></div>
  <div id="clock"><div id="hello"></div><div id="time"></div><div id="date"></div></div>
  <div class="glass" id="dockbg"></div><div id="dock"></div>
  <div id="toast"><span></span></div>
  <div class="glass" id="set"><h1 id="sT"></h1><div id="rows"></div><div class="hint" id="sH"></div></div>
</div>
<style id="sceneCss"></style>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- Apps: edit URLs here. "tz" = Tizen app id, used only when packaged as a Tizen app ---------- */
  var APPS = [
    { n: 'YouTube', url: 'https://www.youtube.com/tv', tz: '111299001912', bg: 'linear-gradient(160deg,#ffffff,#e6e6ea)', g: 'rgba(255,40,40,.6)',
      svg: '<rect x="17" y="28" width="66" height="44" rx="14" fill="#f00"/><path d="M43 38v24l21-12z" fill="#fff"/>' },
    { n: 'Spotify', url: 'https://open.spotify.com', tz: '3201606009684', bg: 'linear-gradient(160deg,#1c1c1c,#050505)', g: 'rgba(30,215,96,.6)',
      svg: '<circle cx="50" cy="50" r="33" fill="#1ed760"/><g fill="none" stroke="#0a0a0a" stroke-linecap="round"><path d="M30 38q21-7 42 3" stroke-width="6"/><path d="M33 50q17-5 34 3" stroke-width="5"/><path d="M36 61q14-4 27 2" stroke-width="4"/></g>' },
    { n: 'Netflix', url: 'https://www.netflix.com', tz: '11101200001', bg: 'linear-gradient(160deg,#1a1a1a,#000)', g: 'rgba(229,9,20,.6)',
      svg: '<path d="M34 18h12v64H34zM54 18h12v64H54z" fill="#b1060f"/><path d="M34 18h12l20 64H54z" fill="#e50914"/>' },
    { n: 'Stremio', url: 'https://web.stremio.com', tz: '', bg: 'linear-gradient(160deg,#8b6cff,#5a37d4)', g: 'rgba(139,108,255,.65)',
      svg: '<circle cx="50" cy="50" r="31" fill="rgba(20,8,70,.28)"/><path d="M42 36l22 14-22 14z" fill="#fff" stroke="#fff" stroke-width="7" stroke-linejoin="round"/>' },
    { n: 'Tesla', url: 'https://www.tesla.com/teslaaccount', tz: '', bg: 'linear-gradient(160deg,#23272e,#0d0f13)', g: 'rgba(232,33,39,.6)',
      svg: '<path d="M16 33Q50 14 84 33l-5 8Q50 26 21 41z" fill="#e82127"/><path d="M45 34h10l-2.6 48q-2.4 3-4.8 0z" fill="#e82127"/>' }
  ];
  var GEAR = { n: 'Settings', bg: 'linear-gradient(160deg,#4a505c,#262a32)', g: 'rgba(255,255,255,.4)',
    svg: '<circle cx="50" cy="50" r="26" fill="none" stroke="#eef1f6" stroke-width="9" stroke-dasharray="10.21 10.21"/><path fill="#eef1f6" fill-rule="evenodd" d="M50 28a22 22 0 1 0 .01 0zM50 40a10 10 0 1 1-.01 0z"/>' };

  /* ---------- Themes (scene is generated, so no image downloads) ---------- */
  var THEMES = {
    forest: { s0: '#031210', s1: '#0e4039', moon: '#e4fff4', r: ['#115049', '#0b3b38', '#062826', '#02130f'], acc: 'rgba(94,234,212,.55)' },
    dusk:   { s0: '#090720', s1: '#3d2c70', moon: '#ffe8d4', r: ['#3c3175', '#292058', '#171238', '#080620'], acc: 'rgba(196,181,253,.55)' },
    aurora: { s0: '#020c18', s1: '#0a4658', moon: '#e0f7ff', r: ['#0d4b5a', '#08333f', '#04212b', '#020f15'], acc: 'rgba(110,231,183,.55)', aur: 1 }
  };
  function scene(t) {
    var seed = 11;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    function ry(i, x) {
      var b = 540 + i * 105, a = 150 - i * 12, p = i * 1.7;
      return b - a * (0.5 * Math.sin(x * 0.004 + p) + 0.3 * Math.sin(x * 0.011 + p * 2) + 0.2 * Math.sin(x * 0.027 + p * 3));
    }
    var s = '<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">' +
      '<defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + t.s0 + '"/><stop offset="1" stop-color="' + t.s1 + '"/></linearGradient>' +
      '<radialGradient id="m"><stop offset="0" stop-color="' + t.moon + '" stop-opacity=".35"/><stop offset="1" stop-color="' + t.moon + '" stop-opacity="0"/></radialGradient>' +
      '<radialGradient id="g"><stop offset="0" stop-color="#5dffb4" stop-opacity=".3"/><stop offset="1" stop-color="#5dffb4" stop-opacity="0"/></radialGradient></defs>' +
      '<rect width="1920" height="1080" fill="url(#a)"/>';
    if (t.aur) s += '<ellipse cx="1000" cy="250" rx="900" ry="140" fill="url(#g)" transform="rotate(-8 1000 250)"/><ellipse cx="1300" cy="170" rx="600" ry="90" fill="url(#g)" transform="rotate(6 1300 170)"/>';
    for (var k = 0; k < 90; k++) s += '<circle cx="' + (rnd() * 1920 | 0) + '" cy="' + (rnd() * 520 | 0) + '" r="' + (0.6 + rnd() * 1.4).toFixed(1) + '" fill="#fff" opacity="' + (0.25 + rnd() * 0.6).toFixed(2) + '"/>';
    s += '<circle cx="1530" cy="210" r="300" fill="url(#m)"/><circle cx="1530" cy="210" r="46" fill="' + t.moon + '"/>';
    for (var i = 0; i < 4; i++) {
      var d = 'M0 1080L0 ' + ry(i, 0).toFixed(0);
      for (var x = 20; x <= 1940; x += 20) d += 'L' + x + ' ' + ry(i, x).toFixed(0);
      s += '<path d="' + d + 'L1940 1080Z" fill="' + t.r[i] + '"/>';
      if (i > 0) {
        var p = '', step = 52 - i * 8;
        for (var tx = -10; tx < 1940; tx += step * (0.7 + rnd() * 0.7)) {
          var y = ry(i, tx) + 6, h = 50 + i * 22 + rnd() * 40, w = h * 0.26;
          p += 'M' + (tx - w).toFixed(0) + ' ' + y.toFixed(0) + 'L' + tx.toFixed(0) + ' ' + (y - h).toFixed(0) + 'L' + (tx + w).toFixed(0) + ' ' + y.toFixed(0) + 'Z';
          p += 'M' + (tx - w * 0.75).toFixed(0) + ' ' + (y - h * 0.35).toFixed(0) + 'L' + tx.toFixed(0) + ' ' + (y - h * 1.1).toFixed(0) + 'L' + (tx + w * 0.75).toFixed(0) + ' ' + (y - h * 0.35).toFixed(0) + 'Z';
        }
        s += '<path d="' + p + '" fill="' + t.r[i] + '"/>';
      }
    }
    return s + '</svg>';
  }

  /* ---------- Settings / i18n ---------- */
  var DEF = { h24: true, sec: false, lang: 'en', theme: 'forest', anim: true };
  var S = {};
  (function () {
    var o = {}; try { o = JSON.parse(localStorage.getItem('tvlauncher') || '{}'); } catch (e) {}
    for (var k in DEF) S[k] = (o[k] === undefined) ? DEF[k] : o[k];
  })();
  function save() { try { localStorage.setItem('tvlauncher', JSON.stringify(S)); } catch (e) {} }

  var L = {
    en: { days: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'],
          mon: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
          hi: ['Good night', 'Good morning', 'Good afternoon', 'Good evening'], set: 'Settings', fmt: 'Time format', sec: 'Show seconds', lang: 'Language', th: 'Theme', an: 'Animations',
          h24: '24-hour', h12: '12-hour', on: 'On', off: 'Off', done: 'Done', open: 'Opening ', hint: 'Left / Right to change   ·   Back to close', date: function (w, d, m) { return w + ', ' + d + ' ' + m; },
          themes: { forest: 'Forest', dusk: 'Dusk', aurora: 'Aurora' } },
    nl: { days: ['zondag', 'maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag'],
          mon: ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli', 'augustus', 'september', 'oktober', 'november', 'december'],
          hi: ['Goedenacht', 'Goedemorgen', 'Goedemiddag', 'Goedenavond'], set: 'Instellingen', fmt: 'Tijdnotatie', sec: 'Seconden tonen', lang: 'Taal', th: 'Thema', an: 'Animaties',
          h24: '24-uurs', h12: '12-uurs', on: 'Aan', off: 'Uit', done: 'Klaar', open: 'Openen: ', hint: 'Links / rechts om te wijzigen   ·   Terug om te sluiten', date: function (w, d, m) { return w + ' ' + d + ' ' + m; },
          themes: { forest: 'Bos', dusk: 'Schemering', aurora: 'Aurora' } }
  };
  function T() { return L[S.lang]; }

  var ROWS = [
    { k: 'h24', lab: 'fmt', opts: [true, false], show: function (v) { return v ? T().h24 : T().h12; } },
    { k: 'sec', lab: 'sec', opts: [false, true], show: function (v) { return v ? T().on : T().off; } },
    { k: 'lang', lab: 'lang', opts: ['en', 'nl'], show: function (v) { return v === 'en' ? 'English' : 'Nederlands'; } },
    { k: 'theme', lab: 'th', opts: ['forest', 'dusk', 'aurora'], show: function (v) { return T().themes[v]; } },
    { k: 'anim', lab: 'an', opts: [true, false], show: function (v) { return v ? T().on : T().off; } }
  ];

  /* ---------- Build UI ---------- */
  var stage = $('stage'), dock = $('dock'), tiles = [], view = 'home', fi = 0, si = 0;
  function tileHtml(a) { return '<svg viewBox="0 0 100 100">' + a.svg + '</svg>'; }
  function buildDock() {
    dock.innerHTML = '';
    tiles = [];
    for (var i = 0; i <= APPS.length; i++) {
      if (i === APPS.length) { var sp = document.createElement('div'); sp.className = 'sep'; dock.appendChild(sp); }
      var a = i < APPS.length ? APPS[i] : GEAR, el = document.createElement('div');
      el.className = 'tile'; el.innerHTML = tileHtml(a);
      el.style.background = a.bg; el.style.setProperty('--g', a.g);
      el.setAttribute('aria-label', i < APPS.length ? a.n : T().set);
      (function (n) { el.onclick = function () { fi = n; focus(); activate(); }; })(i);
      dock.appendChild(el); tiles.push(el);
    }
  }
  function focus() { for (var i = 0; i < tiles.length; i++) tiles[i].className = 'tile' + (i === fi ? ' on' : ''); }

  function buildRows() {
    var h = '';
    for (var i = 0; i < ROWS.length; i++) {
      var r = ROWS[i];
      h += '<div class="row' + (i === si ? ' on' : '') + '"><b>' + T()[r.lab] + '</b><span><span class="ar">‹</span><span class="v">' + r.show(S[r.k]) + '</span><span class="ar">›</span></span></div>';
    }
    h += '<div class="row done' + (si === ROWS.length ? ' on' : '') + '"><b>' + T().done + '</b></div>';
    $('rows').innerHTML = h; $('sT').textContent = T().set; $('sH').textContent = T().hint;
  }

  function applyTheme() {
    var t = THEMES[S.theme];
    var url = 'url("data:image/svg+xml;utf8,' + encodeURIComponent(scene(t)) + '")';
    $('sceneCss').textContent = '.scene,.glass:before{background-image:' + url + '}';
    stage.style.setProperty('--acc', t.acc);
    document.body.className = S.anim ? '' : 'noanim';
  }

  /* ---------- Clock ---------- */
  var last = '';
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function tick() {
    var d = new Date(), h = d.getHours(), ap = '';
    if (!S.h24) { ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; }
    var html = (S.h24 ? pad(h) : h) + '<i class="c">:</i>' + pad(d.getMinutes()) + (S.sec ? '<small>' + pad(d.getSeconds()) + '</small>' : '') + (ap ? '<small>' + ap + '</small>' : '');
    if (html !== last) { last = html; $('time').innerHTML = html; }
    var t = T(), hr = d.getHours(), g = hr < 5 ? 0 : hr < 12 ? 1 : hr < 18 ? 2 : 3;
    $('hello').textContent = t.hi[g];
    $('date').textContent = t.date(t.days[d.getDay()], d.getDate(), t.mon[d.getMonth()]);
  }

  /* ---------- Actions ---------- */
  var toastT;
  function toast(msg) {
    var el = $('toast'); el.firstChild.textContent = msg; el.style.opacity = 1;
    clearTimeout(toastT); toastT = setTimeout(function () { el.style.opacity = 0; }, 2500);
  }
  function openSettings(on) {
    view = on ? 'settings' : 'home';
    stage.className = on ? 'vs' : '';
    if (on) { si = 0; buildRows(); }
  }
  function launch(a) {
    toast(T().open + a.n);
    var go = function () { window.location.href = a.url; };
    try {
      if (a.tz && window.tizen && tizen.application) { tizen.application.launch(a.tz, function () {}, go); return; }
    } catch (e) {}
    setTimeout(go, 450);
  }
  function activate() {
    if (fi === APPS.length) openSettings(true); else launch(APPS[fi]);
  }
  function change(dir) {
    if (si >= ROWS.length) return;
    var r = ROWS[si], i = r.opts.indexOf(S[r.k]);
    S[r.k] = r.opts[(i + dir + r.opts.length) % r.opts.length];
    save(); applyTheme(); buildDock(); focus(); buildRows(); last = ''; tick();
  }

  document.addEventListener('keydown', function (e) {
    var k = e.keyCode, used = true;
    if (view === 'home') {
      if (k === 37) fi = Math.max(0, fi - 1);
      else if (k === 39) fi = Math.min(tiles.length - 1, fi + 1);
      else if (k === 13) activate();
      else used = false;
      focus();
    } else {
      if (k === 38) { si = Math.max(0, si - 1); buildRows(); }
      else if (k === 40) { si = Math.min(ROWS.length, si + 1); buildRows(); }
      else if (k === 37) change(-1);
      else if (k === 39) change(1);
      else if (k === 13) { if (si === ROWS.length) openSettings(false); else change(1); }
      else if (k === 10009 || k === 27 || k === 8) openSettings(false);
      else used = false;
    }
    if (used) e.preventDefault();
  });

  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);

  try { if (window.tizen && tizen.tvinputdevice) tizen.tvinputdevice.registerKey('Back'); } catch (e) {}
  fit(); applyTheme(); buildDock(); focus(); tick(); setInterval(tick, 1000);
})();
</script>
</body>
</html>
